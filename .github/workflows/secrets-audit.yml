name: secrets-audit

# T-01.4.10 (DEBT-45) -- the non-blocking, scheduled, FULL-HISTORY leg.
#
# Deliberately separate from secrets-gate.yml and deliberately
# non-blocking: this answers "does history contain a secret", whose
# correct response is rotation, never a red PR build. It is NOT a
# substitute for leg 1 (diff-scoped, blocking) -- it exists so a new
# historical finding gets noticed on a cadence, without making every PR
# pay O(history) or making a merged commit's secret un-closeable inside
# someone else's change.
#
# The `.gitleaksignore` baseline (one triaged fixture-literal fingerprint,
# DEBT-45) applies here too. A new finding NOT in the baseline should be
# triaged the same way DEBT-45 was: verify against live credentials,
# rotate if real, fingerprint-pin if not (never a `paths` allowlist).

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-history-audit:
    name: gitleaks full history (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true # non-blocking by design -- see header
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: gitleaks git (full history, .gitleaksignore baseline applies)
        run: gitleaks git . --no-banner --redact -r gitleaks-audit-report.json -f json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history-audit
          path: gitleaks-audit-report.json
          if-no-files-found: ignore
