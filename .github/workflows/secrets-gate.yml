name: secrets-gate

# T-01.4.10 (DEBT-45) -- the redefined gitleaks gate.
#
# Three legs, split by trust and blast radius:
#   1. Blocking, diff-scoped gitleaks scan (this file, job `gitleaks-diff`)
#      -- answers "does THIS PR introduce a secret", not "does history
#      contain one". Scoped to merge-base..HEAD so its verdict is a
#      function of the change under review, not of the past.
#   2. Blocking, pre-commit `gitleaks git --staged` (.githooks/pre-commit)
#      -- client-side, catches a secret before it is even committed.
#      Wired via `scripts/install-git-hooks.sh` (core.hooksPath).
#   3. Assertion, not a scan (this file, job `env-hygiene`) -- CI asserts
#      `.env` is gitignored AND not tracked. Two commands, no gitleaks
#      invocation.
#
# The full-history audit (leg 0, informational) lives in a SEPARATE,
# non-blocking, scheduled workflow: secrets-audit.yml. It must never gate
# a PR -- any historical finding is un-closeable except by rewriting
# published history, and "a control whose only remedy is a destructive
# operation is not a control" (Atchim, FU-01.3-D DoD (h) ruling).
#
# The `.gitleaksignore` baseline (DEBT-45, one triaged fixture-literal
# fingerprint) applies to every gitleaks invocation below by gitleaks'
# own default (-i defaults to ".", the repo root). Do NOT add a `paths`
# allowlist for tests/ here or in any gitleaks config -- it blinds the
# gate on the highest-risk file class in the repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks-diff:
    name: leg 1 -- blocking, diff-scoped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Checksum-verified, not piped straight into tar (containment
        # review 2026-09-23): gitleaks publishes a checksums.txt per
        # release; download the archive to disk, verify its SHA256
        # against the pinned digest below, then extract.
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin gitleaks -f gitleaks_8.30.1_linux_x64.tar.gz
          rm gitleaks_8.30.1_linux_x64.tar.gz

      - name: Resolve diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1000
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: gitleaks git (diff-scoped, .gitleaksignore baseline applies)
        run: |
          gitleaks git . --log-opts="${{ steps.range.outputs.base }}..HEAD" --no-banner --redact

  env-hygiene:
    name: leg 3 -- assertion, not a scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: .env must be ignored
        run: git check-ignore -q .env

      - name: .env must NOT be tracked
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked -- this must never happen (INV-05, NFR N4)"
            exit 1
          fi

  lockfile-pin:
    name: lock-file is pinned and installable (CLAUDE.md ## Tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4 (resolves "v3")

      - name: uv.lock must be committed and up to date with pyproject.toml
        run: uv lock --check

      - name: install from the lock file only (no re-resolution)
        run: uv sync --locked --all-extras --dev
