[project]
name = "idp-regression-tester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Costa", email = "alex@divinocosta.com.br" }
]
requires-python = ">=3.13"
dependencies = [
    "langfuse>=4.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idp_regression"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A regression in poll/retry budget math (frozen fake clock, unbounded
# loop) must never hang the suite — bounded per-test wall clock, generous
# enough for the live-integration tests (Atchim suggestion).
timeout = 120
markers = [
    "integration: requires live external services (skipped by default; opt in with RUN_INTEGRATION_TESTS=1)",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["idp_regression"]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
